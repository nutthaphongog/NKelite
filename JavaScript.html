<script>
const MONTH_TH = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
const DAY_TH = ['จ', 'อ', 'พ', 'พฤ', 'ศ', 'ส', 'อา']; // เริ่มจันทร์
const SESSIONS_PER_MONTH = 8;       // จ่าย 1 เดือน = 8 สิทธิ์
const LOW_CREDIT_THRESHOLD = 2;     // เหลือน้อยกว่าหรือเท่ากับนี้ = เตือนสีเหลือง
const MAX_PHOTO_LEN = 24000;        // รูปแสดงแค่ ~64px จึงไม่จำเป็นต้องใหญ่ (เล็ก = โหลดเร็ว)
const APP_VERSION = '4.1';
const TZ = 'Asia/Bangkok';
const LS_DATA = 'ar_data_v4';
const LS_PHOTOS = 'ar_photos_v4';
const EMPTY_SET = new Set();

let STATE = { students: [], payments: [], attendance: [], search: '', filter: 'all', weekOffset: 0, loaded: false };
let PHOTOS = {};                    // { studentId: dataURL } (โหลดแยกจากข้อมูลหลัก)
let IDX = { att: new Map(), monthly: new Map(), sess: new Map() };
let STATUS_CACHE = new Map();
let ACTIVE_PAYMENT_STUDENT = null;
let PENDING_DELETE_ID = null;
let PENDING_ATTENDANCE = null;
let MODAL_YEAR = Number(todayStr().slice(0, 4));
let FORM_PHOTO = { value: '', changed: false };
let LAST_REFRESH = 0;
const INFLIGHT = new Set();         // กันกดซ้ำคีย์เดียวกันระหว่างรอเซิร์ฟเวอร์

/* ============================= API BRIDGE ============================= */

async function callApi(action, payload = {}) {
  // เปิดผ่าน Cloudflare (ไม่มี google.script.run) -> เรียก /api/gas
  if (!window.google || !window.google.script || !window.google.script.run) {
    const res = await fetch('/api/gas', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action, ...payload })
    });
    const data = await res.json();
    if (data && data.success === false && data.error) throw new Error(data.error);
    return data;
  }
  // เปิดใน Apps Script Web App โดยตรง
  return new Promise((resolve, reject) => {
    const runner = google.script.run
      .withSuccessHandler((res) => {
        if (res && res.success === false && res.error) reject(new Error(res.error));
        else resolve(res);
      })
      .withFailureHandler(reject);
    const d = payload.dateStr || payload.date;
    if (action === 'getAllData') runner.getAllData();
    else if (action === 'getPhotos') runner.getPhotos();
    else if (action === 'addStudent') runner.addStudent(payload.data || payload);
    else if (action === 'updateStudent') runner.updateStudent(payload.data || payload);
    else if (action === 'deleteStudent') runner.deleteStudent(payload.id);
    else if (action === 'toggleAttendance') runner.toggleAttendance(payload.studentId, d, payload.desired);
    else if (action === 'toggleSessionPayment') runner.toggleSessionPayment(payload.studentId, d, payload.desired);
    else if (action === 'toggleMonthlyPayment') runner.toggleMonthlyPayment(payload.studentId, payload.monthStr || payload.month, payload.desired);
    else reject(new Error('Unknown action: ' + action));
  });
}

/* ============================= BOOTSTRAP ============================= */

document.addEventListener('DOMContentLoaded', () => {
  bindGlobalEvents();
  bootstrap();
});

// แสดงข้อมูลที่แคชไว้ทันที (ไม่ต้องรอ Google Apps Script) แล้วอัปเดตเบื้องหลัง
function bootstrap() {
  showVersions('กำลังตรวจสอบ...');
  const cached = readLS(LS_DATA);
  if (cached && cached.students) {
    PHOTOS = readLS(LS_PHOTOS) || {};
    applyData(cached);
    hideVeil();
    render();
  }
  refreshData();
}

function refreshData() {
  return callApi('getAllData').then(data => {
    if (typeof data === 'string') data = JSON.parse(data);
    if (!data || !data.students) throw new Error('เซิร์ฟเวอร์ตอบกลับมาว่างเปล่า โปรดตรวจสอบ Code.gs');
    LAST_REFRESH = Date.now();
    showVersions(data.version);
    if (INFLIGHT.size > 0) return;           // กำลังบันทึกอยู่ อย่าเขียนทับข้อมูลที่เพิ่งแก้
    applyData(data);
    writeLS(LS_DATA, { students: STATE.students.map(stripPhoto), payments: STATE.payments, attendance: STATE.attendance });
    hideVeil();
    render();
    loadPhotos();
  }).catch(err => {
    if (!STATE.loaded) onLoadError(err);
    else showToast('อัปเดตข้อมูลล่าสุดไม่สำเร็จ กำลังใช้ข้อมูลที่บันทึกไว้');
  });
}

function loadPhotos() {
  callApi('getPhotos').then(res => {
    if (typeof res === 'string') res = JSON.parse(res);
    if (!res || !res.photos) return;
    const server = res.photos;
    // กันรูปหาย: ถ้าเซิร์ฟเวอร์ตอบว่าง แต่เครื่องนี้มีรูปอยู่แล้ว ให้คงรูปเดิมไว้ (ไม่เขียนทับด้วยค่าว่าง)
    if (Object.keys(server).length === 0 && Object.values(PHOTOS).some(Boolean)) {
      console.warn('getPhotos ตอบกลับว่าง — คงรูปที่แคชไว้');
      return;
    }
    PHOTOS = Object.assign({}, server);
    STATE.students.forEach(s => { s.photo = PHOTOS[s.id] || ''; });
    writeLS(LS_PHOTOS, PHOTOS);
    renderRoster();
  }).catch(err => {
    // เซิร์ฟเวอร์เก่าไม่มี getPhotos (ใช้รูปที่มากับ getAllData แทน) — กรณีอื่นให้บันทึกไว้ดูใน Console
    if (!/Unknown action/.test((err && err.message) || '')) console.warn('getPhotos ล้มเหลว:', err);
  });
}

function showVersions(serverVersion) {
  const el = document.getElementById('verInfo');
  if (el) el.textContent = 'หน้าเว็บ v' + APP_VERSION + '  ·  สคริปต์ ' + (serverVersion || 'เวอร์ชันเก่า (ยังไม่ได้ Deploy ใหม่)');
}

function applyData(data) {
  STATE.students = (data.students || []).map(s => {
    if (s.photo) PHOTOS[s.id] = s.photo;     // เซิร์ฟเวอร์เก่าส่งรูปมาด้วย
    return Object.assign({}, s, { photo: PHOTOS[s.id] || '' });
  });
  STATE.payments = data.payments || [];
  STATE.attendance = data.attendance || [];
  STATE.loaded = true;
  rebuildIndex();
}

function stripPhoto(s) { const c = Object.assign({}, s); delete c.photo; return c; }
function readLS(k) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch (e) { return null; } }
function writeLS(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* เต็ม/ปิดใช้งาน: ข้าม */ } }
function persistLocal() {
  writeLS(LS_DATA, { students: STATE.students.map(stripPhoto), payments: STATE.payments, attendance: STATE.attendance });
}

function hideVeil() {
  const veil = document.getElementById('loadingVeil');
  if (veil && veil.style.display !== 'none') {
    veil.style.opacity = '0';
    setTimeout(() => (veil.style.display = 'none'), 200);
  }
}

function onLoadError(err) {
  console.error(err);
  const veil = document.getElementById('loadingVeil');
  if (!veil) return;
  veil.innerHTML = `
    <div style="max-width:340px;text-align:center;padding:0 20px;">
      <div style="font-size:15px;font-weight:600;margin-bottom:8px;">โหลดข้อมูลไม่สำเร็จ</div>
      <div style="font-size:12.5px;color:#6B7280;margin-bottom:16px;line-height:1.6;">
        ${escapeHtml((err && err.message) ? err.message : 'ไม่ทราบสาเหตุ')}<br><br>
        ตรวจสอบการเชื่อมต่อ Google Sheets หรือ Deploy สคริปต์ใหม่อีกครั้ง
      </div>
      <button onclick="location.reload()" style="padding:9px 18px;border-radius:10px;border:none;background:#0B1E3D;color:#fff;font-weight:500;font-size:13px;">ลองใหม่</button>
    </div>`;
  veil.style.opacity = '1';
  veil.style.display = 'flex';
}

function onError(err) {
  console.error(err);
  showToast('เกิดข้อผิดพลาด: ' + ((err && err.message) || err));
}

/* ============================= HELPERS ============================= */

// วันที่ตามเวลาไทยเสมอ (กันเครื่องที่ตั้งเขตเวลาผิดแล้วเช็คชื่อลงวันผิด)
function todayStr() {
  try { return new Date().toLocaleDateString('sv-SE', { timeZone: TZ }); }
  catch (e) { return toDateStr(new Date()); }
}
function toDateStr(d) {
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function currentMonthStr() { return todayStr().slice(0, 7); }
function formatDateTH(dateStr) {
  if (!dateStr) return '-';
  const parts = String(dateStr).split('-');
  if (parts.length !== 3) return dateStr;
  return `${parseInt(parts[2], 10)} ${MONTH_TH[parseInt(parts[1], 10) - 1]} ${parts[0]}`;
}
function escapeHtml(str) {
  return String(str == null ? '' : str).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function initialOf(s) {
  const t = (s.nickname || s.fullName || '?').trim();
  return t ? Array.from(t)[0] : '?';
}

// รูป: แปลง data URL เป็น blob URL ครั้งเดียว (ไม่ฝัง base64 ก้อนใหญ่ใน HTML ทุกครั้งที่ render)
const BLOB_CACHE = new Map();
function photoSrc(s) {
  const raw = s.photo;
  if (!raw || String(raw).indexOf('data:image/') !== 0) return '';
  const hit = BLOB_CACHE.get(s.id);
  if (hit && hit.raw === raw) return hit.url;
  let url = raw;
  try {
    const comma = raw.indexOf(',');
    const mime = raw.slice(5, raw.indexOf(';'));
    const bin = atob(raw.slice(comma + 1));
    const arr = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    url = URL.createObjectURL(new Blob([arr], { type: mime }));
    if (hit && hit.url.indexOf('blob:') === 0) URL.revokeObjectURL(hit.url);
  } catch (e) { url = raw; }
  BLOB_CACHE.set(s.id, { raw, url });
  return url;
}
function avatarHtml(s) {
  const src = photoSrc(s);
  return src ? `<img src="${escapeHtml(src)}" alt="" decoding="async">` : escapeHtml(initialOf(s));
}

// 7 วันของสัปดาห์ (จันทร์-อาทิตย์) ตาม offset โดยอิงวันที่ตามเวลาไทย
function getWeekDates(offset = 0) {
  const [y, m, d] = todayStr().split('-').map(Number);
  const now = new Date(y, m - 1, d, 12);
  now.setDate(now.getDate() + offset * 7);
  const dow = now.getDay();
  const monday = new Date(now);
  monday.setDate(now.getDate() + (dow === 0 ? -6 : 1 - dow));
  const days = [];
  for (let i = 0; i < 7; i++) {
    const x = new Date(monday);
    x.setDate(monday.getDate() + i);
    days.push(x);
  }
  return days;
}

/* ============================= DATA INDEX ============================= */
// สร้างดัชนีครั้งเดียวทุกครั้งที่ข้อมูลเปลี่ยน -> การค้นหาเป็น O(1) แทนการ filter ทั้งตารางซ้ำๆ ตอน render

function rebuildIndex() {
  const att = new Map(), monthly = new Map(), sess = new Map();
  const add = (map, id, v) => { let s = map.get(id); if (!s) { s = new Set(); map.set(id, s); } s.add(v); };
  for (const a of STATE.attendance) {
    if (a.attended) add(att, String(a.studentId).trim(), String(a.date).trim());
  }
  for (const p of STATE.payments) {
    if (!p.paid) continue;
    const id = String(p.studentId).trim(), period = String(p.period).trim();
    if (p.type === 'monthly') add(monthly, id, period);
    else if (p.type === 'session') add(sess, id, period);
  }
  IDX = { att, monthly, sess };
  STATUS_CACHE = new Map();
}

const attendedSet = id => IDX.att.get(String(id).trim()) || EMPTY_SET;
const monthlyPaidSet = id => IDX.monthly.get(String(id).trim()) || EMPTY_SET;
const sessionPaidSet = id => IDX.sess.get(String(id).trim()) || EMPTY_SET;
const isAttended = (id, date) => attendedSet(id).has(String(date).trim());
const studentAttendance = id => Array.from(attendedSet(id)).map(date => ({ date }));
const totalSessions = s => {
  const n = Number(s.sessionCount);
  const base = (isFinite(n) && n >= 0 && n < 10000) ? n : 0;   // กันค่าเพี้ยน (เช่น วันที่ในเซลล์)
  return base + attendedSet(s.id).size;
};

// นโยบายรายเดือน: เดือนที่จ่าย x 8 - จำนวนครั้งที่เช็คชื่อ (ไม่มาไม่ถูกหัก ไม่รีเซ็ตข้ามเดือน)
function monthlyCredits(student) {
  const paidMonths = monthlyPaidSet(student.id).size;
  const total = paidMonths * SESSIONS_PER_MONTH;
  const used = attendedSet(student.id).size;
  return { paidMonths, total, used, remaining: total - used };
}

function getPaymentStatus(student) {
  const hit = STATUS_CACHE.get(student.id);
  if (hit && hit.t === student.paymentType) return hit.v;
  const v = computeStatus(student);
  STATUS_CACHE.set(student.id, { t: student.paymentType, v });
  return v;
}

function computeStatus(student) {
  if (student.paymentType === 'monthly') {
    const c = monthlyCredits(student);
    if (c.remaining > LOW_CREDIT_THRESHOLD) {
      return { state: 'ok', paid: true, typeLabel: 'รายเดือน', label: `เหลือ ${c.remaining} ครั้ง`, note: `ใช้แล้ว ${c.used} จาก ${c.total} ครั้ง` };
    }
    if (c.remaining > 0) {
      return { state: 'low', paid: true, typeLabel: 'รายเดือน', label: `เหลือ ${c.remaining} ครั้ง`, note: 'ใกล้หมด ควรต่อเดือนใหม่' };
    }
    if (c.remaining === 0) {
      return { state: 'due', paid: false, typeLabel: 'รายเดือน', label: 'หมดสิทธิ์ ต้องต่อเดือน', note: c.total ? `ใช้ครบ ${c.total} ครั้งแล้ว` : 'ยังไม่เคยชำระ' };
    }
    return { state: 'due', paid: false, typeLabel: 'รายเดือน', label: `เกินสิทธิ์ ${-c.remaining} ครั้ง`, note: 'ต้องชำระเดือนใหม่' };
  }
  // รายครั้ง: นับเฉพาะวันที่มาเรียนในเดือนปัจจุบันที่ยังไม่จ่าย
  const cm = currentMonthStr();
  const paid = sessionPaidSet(student.id);
  let attendedThisMonth = 0, unpaid = 0;
  attendedSet(student.id).forEach(d => {
    if (d.startsWith(cm)) { attendedThisMonth++; if (!paid.has(d)) unpaid++; }
  });
  if (attendedThisMonth === 0) return { state: 'ok', paid: true, typeLabel: 'รายครั้ง', label: 'ไม่มีรอบค้าง', note: '' };
  if (unpaid === 0) return { state: 'ok', paid: true, typeLabel: 'รายครั้ง', label: 'ชำระครบแล้ว', note: `เดือนนี้เรียน ${attendedThisMonth} ครั้ง` };
  return { state: 'due', paid: false, typeLabel: 'รายครั้ง', label: `ค้าง ${unpaid} ครั้ง`, note: `เดือนนี้เรียน ${attendedThisMonth} ครั้ง` };
}
function isPaidNow(student) { return getPaymentStatus(student).paid; }

function showToast(msg) {
  const t = document.getElementById('toast');
  if (!t) return;
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 2200);
}
function openModal(id) { document.getElementById(id).classList.add('open'); }
function closeModal(id) { document.getElementById(id).classList.remove('open'); }

/* ============================= RENDER ============================= */

function render() {
  updateWeekDisplay();
  renderStats();
  renderRoster();
}

function updateWeekDisplay() {
  const week = getWeekDates(STATE.weekOffset);
  const o = STATE.weekOffset;
  const prefix = o === 0 ? 'สัปดาห์นี้' : o === -1 ? 'สัปดาห์ที่แล้ว' : o === 1 ? 'สัปดาห์หน้า' : o < 0 ? `ย้อนหลัง ${-o} สัปดาห์` : `ล่วงหน้า ${o} สัปดาห์`;
  document.getElementById('weekDisplayLabel').textContent = `${prefix}  ${formatDateTH(toDateStr(week[0]))} - ${formatDateTH(toDateStr(week[6]))}`;
  document.getElementById('btnResetWeek').style.display = o === 0 ? 'none' : 'inline';
}

function renderStats() {
  const today = todayStr();
  let atToday = 0, due = 0, session = 0, monthly = 0;
  for (const s of STATE.students) {
    if (isAttended(s.id, today)) atToday++;
    if (!isPaidNow(s)) due++;
    if (s.paymentType === 'monthly') monthly++; else if (s.paymentType === 'session') session++;
  }
  document.getElementById('statTotal').textContent = STATE.students.length;
  document.getElementById('statToday').textContent = atToday;
  document.getElementById('statDue').textContent = due;
  document.getElementById('statSession').textContent = session;
  document.getElementById('statMonthly').textContent = monthly;
}

function filteredStudents() {
  let list = STATE.students;
  const q = STATE.search.trim().toLowerCase();
  if (q) {
    list = list.filter(s =>
      (s.fullName || '').toLowerCase().includes(q) ||
      (s.nickname || '').toLowerCase().includes(q) ||
      (s.id || '').toLowerCase().includes(q));
  }
  if (STATE.filter === 'due') list = list.filter(s => !isPaidNow(s));
  if (STATE.filter === 'paid') list = list.filter(s => isPaidNow(s));
  return list;
}

const CHECK_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4"><path d="M20 6 9 17l-5-5"/></svg>';

function weekHtml(s) {
  const week = getWeekDates(STATE.weekOffset);
  const today = todayStr();
  const set = attendedSet(s.id);
  const sid = escapeHtml(s.id);
  const cells = week.map((d, i) => {
    const ds = toDateStr(d);
    const on = set.has(ds);
    const cls = ['day-btn'];
    if (on) cls.push('on');
    if (ds === today) cls.push('today');
    return `<div class="day"><div class="day-label">${DAY_TH[i]}</div>
      <button type="button" class="${cls.join(' ')}" data-action="day" data-id="${sid}" data-date="${ds}"
        title="${formatDateTH(ds)}">${on ? CHECK_SVG : d.getDate()}</button></div>`;
  }).join('');
  const done = set.has(today);
  return `
    <div class="strip">${cells}</div>
    <div class="week-foot">
      <button type="button" class="checkin ${done ? 'done' : ''}" data-action="quickcheckin" data-id="${sid}">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8"><path d="M20 6 9 17l-5-5"/></svg>
        ${done ? 'มาแล้ววันนี้' : 'เช็คชื่อวันนี้'}
      </button>
      <span class="total">เรียนรวม <b>${totalSessions(s)}</b> ครั้ง</span>
    </div>`;
}

function cardHtml(s) {
  const st = getPaymentStatus(s);
  const id = escapeHtml(s.id);
  return `
    <div class="card" data-id="${id}">
      <div class="c-id">
        <div class="avatar">${avatarHtml(s)}</div>
        <div style="min-width:0">
          <div class="c-name">${escapeHtml(s.fullName || '-')}</div>
          <div class="c-meta">
            <span class="nick">${escapeHtml(s.nickname || '-')}</span>
            <span>${id}</span>
            ${s.age ? `<span>${escapeHtml(s.age)} ปี</span>` : ''}
          </div>
        </div>
      </div>
      <div class="c-week">${weekHtml(s)}</div>
      <div class="c-pay">
        <button class="chip ${st.state}" data-action="pay" data-id="${id}">${escapeHtml(st.label)}</button>
        <span class="pay-note">${escapeHtml(st.typeLabel)}${st.note ? ' ' + escapeHtml(st.note) : ''}</span>
      </div>
      <div class="c-actions">
        <button class="icon-btn pay-btn" data-action="pay" data-id="${id}" title="การชำระเงิน" aria-label="การชำระเงิน">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg>
        </button>
        <button class="icon-btn" data-action="edit" data-id="${id}" title="แก้ไข" aria-label="แก้ไข">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4Z"/></svg>
        </button>
        <button class="icon-btn danger" data-action="delete" data-id="${id}" title="ลบ" aria-label="ลบ">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0-1 14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2L4 6"/></svg>
        </button>
      </div>
    </div>`;
}

function renderRoster() {
  const body = document.getElementById('rosterBody');
  const empty = document.getElementById('emptyState');
  const list = filteredStudents();
  if (list.length === 0) {
    empty.style.display = STATE.students.length === 0 ? 'block' : 'none';
    body.innerHTML = STATE.students.length > 0 ? '<div class="empty"><p style="margin:0">ไม่พบนักเรียนที่ตรงกับเงื่อนไข</p></div>' : '';
    return;
  }
  empty.style.display = 'none';
  body.innerHTML = list.map(cardHtml).join('');
}

// อัปเดตเฉพาะการ์ดของคนที่เปลี่ยน (ไม่สร้างทั้งรายการใหม่) — ถ้ามีตัวกรองสถานะให้สร้างใหม่ทั้งหมดเพราะอาจต้องเพิ่ม/ซ่อนการ์ด
function refreshStudent(id) {
  renderStats();
  const s = STATE.students.find(x => x.id === id);
  const el = document.querySelector(`.card[data-id="${CSS.escape(id)}"]`);
  if (!s || !el || STATE.filter !== 'all') { renderRoster(); return; }
  const tpl = document.createElement('template');
  tpl.innerHTML = cardHtml(s).trim();
  el.replaceWith(tpl.content.firstElementChild);
}

/* ============================= EVENTS ============================= */

function bindGlobalEvents() {
  const on = (id, ev, fn) => { const el = document.getElementById(id); if (el) el.addEventListener(ev, fn); };

  let searchTimer;
  on('searchInput', 'input', e => {
    STATE.search = e.target.value;
    clearTimeout(searchTimer);
    searchTimer = setTimeout(renderRoster, 120);     // ไม่ render ทุกตัวอักษรที่พิมพ์
  });

  on('filterSeg', 'click', e => {
    const btn = e.target.closest('button[data-filter]');
    if (!btn) return;
    document.querySelectorAll('#filterSeg button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    STATE.filter = btn.dataset.filter;
    renderRoster();
  });

  on('btnPrevWeek', 'click', () => { STATE.weekOffset--; render(); });
  on('btnNextWeek', 'click', () => { STATE.weekOffset++; render(); });
  on('btnResetWeek', 'click', () => { STATE.weekOffset = 0; render(); });

  on('btnAddStudent', 'click', () => openStudentModal());
  on('btnAddStudentEmpty', 'click', () => openStudentModal());

  document.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', () => closeModal(b.dataset.close)));
  document.querySelectorAll('.overlay').forEach(ov => ov.addEventListener('click', e => { if (e.target === ov) ov.classList.remove('open'); }));

  on('paymentTypeGroup', 'click', e => {
    const opt = e.target.closest('.radio');
    if (!opt) return;
    document.querySelectorAll('#paymentTypeGroup .radio').forEach(o => o.classList.remove('sel'));
    opt.classList.add('sel');
    const r = opt.querySelector('input');
    if (r) r.checked = true;
  });

  on('btnSaveStudent', 'click', saveStudent);
  on('btnConfirmDelete', 'click', confirmDelete);
  on('btnConfirmAttendance', 'click', confirmAttendance);

  on('btnPickPhoto', 'click', () => document.getElementById('f_photoFile').click());
  on('f_photoFile', 'change', onPhotoPicked);
  on('btnRemovePhoto', 'click', () => { FORM_PHOTO = { value: '', changed: true }; refreshPhotoPreview(); });

  on('btnPrevYear', 'click', () => { MODAL_YEAR--; if (ACTIVE_PAYMENT_STUDENT) renderMonthGrid(ACTIVE_PAYMENT_STUDENT); });
  on('btnNextYear', 'click', () => { MODAL_YEAR++; if (ACTIVE_PAYMENT_STUDENT) renderMonthGrid(ACTIVE_PAYMENT_STUDENT); });

  on('rosterBody', 'click', e => {
    const btn = e.target.closest('[data-action]');
    if (!btn || btn.disabled) return;
    const id = btn.dataset.id, action = btn.dataset.action;
    if (action === 'pay') openPaymentModal(id);
    if (action === 'edit') openStudentModal(id);
    if (action === 'delete') openDeleteModal(id);
    if (action === 'day') openAttendanceConfirm(id, btn.dataset.date);
    if (action === 'quickcheckin') quickCheckIn(id);
  });

  // หลายคนใช้พร้อมกัน: กลับมาที่แท็บแล้วข้อมูลเก่าเกิน 1 นาที -> ดึงข้อมูลล่าสุดเบื้องหลัง
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && Date.now() - LAST_REFRESH > 60000 && INFLIGHT.size === 0) refreshData();
  });
}

/* ============================= PHOTO ============================= */

// ย่อรูปเป็นสี่เหลี่ยมจัตุรัส JPEG เล็กๆ (รูปโปรไฟล์แสดงแค่ ~64px)
function compressImage(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('อ่านไฟล์รูปไม่ได้'));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error('ไฟล์นี้ไม่ใช่รูปภาพที่รองรับ'));
      img.onload = () => {
        const side = Math.min(img.width, img.height);
        const sx = (img.width - side) / 2, sy = (img.height - side) / 2;
        for (const size of [192, 160, 128, 96]) {
          const canvas = document.createElement('canvas');
          canvas.width = canvas.height = size;
          const ctx = canvas.getContext('2d');
          ctx.fillStyle = '#fff';
          ctx.fillRect(0, 0, size, size);
          ctx.drawImage(img, sx, sy, side, side, 0, 0, size, size);
          for (const q of [0.8, 0.7, 0.58, 0.46, 0.35]) {
            const url = canvas.toDataURL('image/jpeg', q);
            if (url.length <= MAX_PHOTO_LEN) { resolve(url); return; }
          }
        }
        reject(new Error('ไม่สามารถย่อรูปให้เล็กพอได้ ลองเลือกรูปอื่น'));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

function onPhotoPicked(e) {
  const file = e.target.files && e.target.files[0];
  e.target.value = '';
  if (!file) return;
  compressImage(file)
    .then(url => { FORM_PHOTO = { value: url, changed: true }; refreshPhotoPreview(); })
    .catch(onError);
}

function refreshPhotoPreview() {
  const box = document.getElementById('f_photoPreview');
  const name = document.getElementById('f_nickname').value || document.getElementById('f_fullName').value || '?';
  if (FORM_PHOTO.value) box.innerHTML = `<img src="${escapeHtml(FORM_PHOTO.value)}" alt="">`;
  else box.textContent = Array.from(name.trim() || '?')[0];
  document.getElementById('btnRemovePhoto').style.display = FORM_PHOTO.value ? 'inline' : 'none';
  document.getElementById('btnPickPhoto').textContent = FORM_PHOTO.value ? 'เปลี่ยนรูป' : 'เลือกรูป';
}

/* ============================= STUDENT FORM ============================= */

function openStudentModal(id) {
  const isEdit = !!id;
  document.getElementById('studentModalTitle').textContent = isEdit ? 'แก้ไขนักเรียน' : 'เพิ่มนักเรียน';
  const s = isEdit ? STATE.students.find(x => x.id === id) : null;

  document.getElementById('f_id').value = isEdit ? s.id : '';
  document.getElementById('f_fullName').value = isEdit ? s.fullName : '';
  document.getElementById('f_nickname').value = isEdit ? s.nickname : '';
  document.getElementById('f_age').value = isEdit ? s.age : '';
  document.getElementById('f_startDate').value = isEdit ? s.startDate : todayStr();
  document.getElementById('f_sessionCount').value = isEdit ? (s.sessionCount || 0) : 0;

  FORM_PHOTO = { value: isEdit ? (s.photo || '') : '', changed: false };
  refreshPhotoPreview();

  const type = isEdit ? (s.paymentType || 'session') : 'session';
  document.querySelectorAll('#paymentTypeGroup .radio').forEach(o => {
    const match = o.dataset.value === type;
    o.classList.toggle('sel', match);
    o.querySelector('input').checked = match;
  });
  openModal('studentOverlay');
}

function saveStudent() {
  const id = document.getElementById('f_id').value;
  const fullName = document.getElementById('f_fullName').value.trim();
  const nickname = document.getElementById('f_nickname').value.trim();
  const age = document.getElementById('f_age').value;
  const startDate = document.getElementById('f_startDate').value;
  const sessionCount = Number(document.getElementById('f_sessionCount').value || 0);
  const checked = document.querySelector('#paymentTypeGroup input:checked');
  const paymentType = checked ? checked.value : 'session';

  if (!fullName) { showToast('กรุณากรอกชื่อ - นามสกุล'); return; }

  const payload = { id, fullName, nickname, age, startDate, sessionCount, paymentType };
  if (FORM_PHOTO.changed) payload.photo = FORM_PHOTO.value;   // '' = ลบรูป, ไม่ส่ง = คงรูปเดิม

  const btn = document.getElementById('btnSaveStudent');
  btn.textContent = 'กำลังบันทึก...';
  btn.disabled = true;
  const done = () => { btn.textContent = 'บันทึก'; btn.disabled = false; };

  // แสดงผลตามที่ชีตตอบกลับมาเท่านั้น (ไม่มี student แปลว่า Apps Script ยังเป็นเวอร์ชันเก่า)
  const needStudent = (res) => {
    if (!res || !res.student) {
      throw new Error('Apps Script ยังเป็นเวอร์ชันเก่า ข้อมูลอาจไม่ถูกบันทึก: ไปที่ Deploy > Manage deployments > New version แล้วลองอีกครั้ง');
    }
    return res.student;
  };
  const afterSave = (res, msg) => {
    const saved = needStudent(res);
    PHOTOS[saved.id] = saved.photo || '';
    STATUS_CACHE.delete(saved.id);
    const idx = STATE.students.findIndex(x => x.id === saved.id);
    if (idx >= 0) STATE.students[idx] = saved; else STATE.students.push(saved);
    persistLocal();
    writeLS(LS_PHOTOS, PHOTOS);
    done(); closeModal('studentOverlay'); render();
    if (FORM_PHOTO.changed && FORM_PHOTO.value && res.photoSaved === false) showToast(res.warning || 'บันทึกรูปลงชีตไม่สำเร็จ');
    else showToast(msg);
  };

  if (id) callApi('updateStudent', payload).then(res => afterSave(res, 'บันทึกลงชีตแล้ว')).catch(e => { done(); onError(e); });
  else callApi('addStudent', payload).then(res => afterSave(res, 'เพิ่มนักเรียนและบันทึกลงชีตแล้ว')).catch(e => { done(); onError(e); });
}

/* ============================= LOCAL MUTATIONS (ใช้ร่วมกับ optimistic update) ============================= */

function setLocalAttendance(studentId, date, on) {
  const id = String(studentId).trim(), d = String(date).trim();
  STATE.attendance = STATE.attendance.filter(a => !(String(a.studentId).trim() === id && String(a.date).trim() === d));
  let removed = [];
  if (on) {
    STATE.attendance.push({ studentId: id, date: d, attended: true });
  } else {
    removed = STATE.payments.filter(p => String(p.studentId).trim() === id && p.type === 'session' && String(p.period).trim() === d);
    if (removed.length) STATE.payments = STATE.payments.filter(p => !removed.includes(p));
  }
  rebuildIndex();
  return removed;
}

function setLocalPayment(studentId, type, period, paid) {
  const id = String(studentId).trim(), per = String(period).trim();
  STATE.payments = STATE.payments.filter(p => !(String(p.studentId).trim() === id && p.type === type && String(p.period).trim() === per));
  if (paid) STATE.payments.push({ studentId: id, type, period: per, paid: true });
  rebuildIndex();
}

function refreshPaymentModal(studentId) {
  if (!ACTIVE_PAYMENT_STUDENT || String(ACTIVE_PAYMENT_STUDENT.id).trim() !== String(studentId).trim()) return;
  if (!document.getElementById('paymentOverlay').classList.contains('open')) return;
  if (ACTIVE_PAYMENT_STUDENT.paymentType === 'session') renderSessionToggleList(ACTIVE_PAYMENT_STUDENT);
  else renderMonthGrid(ACTIVE_PAYMENT_STUDENT);
}

/* ============================= ATTENDANCE ============================= */
// Optimistic: วงกลมเปลี่ยนทันที แล้วค่อยยืนยันกับชีต ถ้าล้มเหลวจะย้อนกลับ
// ส่ง desired (true/false) ไปด้วย -> ส่งซ้ำ/ลองใหม่ก็ไม่สลับกลับ

function setAttendance(studentId, dateStr, desired) {
  const key = 'att|' + studentId + '|' + dateStr;
  if (INFLIGHT.has(key)) { showToast('กำลังบันทึก กรุณารอสักครู่'); return; }
  const wasOn = isAttended(studentId, dateStr);
  if (wasOn === desired) return;

  INFLIGHT.add(key);
  const removedPay = setLocalAttendance(studentId, dateStr, desired);
  refreshStudent(studentId);
  refreshPaymentModal(studentId);
  showToast(desired ? 'เช็คชื่อแล้ว' : 'ยกเลิกการเช็คชื่อแล้ว');

  callApi('toggleAttendance', { studentId, dateStr, desired }).then(res => {
    if (res && typeof res.attended === 'boolean' && res.attended !== desired) {
      setLocalAttendance(studentId, dateStr, res.attended);     // เซิร์ฟเวอร์ตอบต่างจากที่ขอ: ยึดตามชีต
    }
  }).catch(err => {
    setLocalAttendance(studentId, dateStr, wasOn);               // ย้อนกลับ
    if (removedPay.length) { STATE.payments.push(...removedPay); rebuildIndex(); }
    onError(err);
  }).finally(() => {
    INFLIGHT.delete(key);
    refreshStudent(studentId);
    refreshPaymentModal(studentId);
    persistLocal();
  });
}

function quickCheckIn(studentId) {
  const d = todayStr();
  setAttendance(studentId, d, !isAttended(studentId, d));
}

function openAttendanceConfirm(studentId, dateStr) {
  const s = STATE.students.find(x => x.id === studentId);
  if (!s) return;
  PENDING_ATTENDANCE = { studentId, dateStr };
  const already = isAttended(studentId, dateStr);

  document.getElementById('attn_title').textContent = already ? 'ยกเลิกการเช็คชื่อ' : 'เช็คชื่อเข้าเรียน';
  document.getElementById('attn_who').textContent = `${s.fullName} (${s.nickname || '-'})`;
  document.getElementById('attn_when').textContent = `วันที่ ${formatDateTH(dateStr)}${dateStr === todayStr() ? ' (วันนี้)' : ''}`;
  document.getElementById('attn_icon').className = 'confirm-ic' + (already ? ' cancel' : '');

  const btn = document.getElementById('btnConfirmAttendance');
  btn.textContent = already ? 'ยกเลิกเช็คชื่อ' : 'ยืนยันว่ามาเรียน';
  btn.className = 'btn ' + (already ? 'btn-danger' : 'btn-primary');
  openModal('attendanceOverlay');
}

function confirmAttendance() {
  if (!PENDING_ATTENDANCE) return;
  const { studentId, dateStr } = PENDING_ATTENDANCE;
  closeModal('attendanceOverlay');
  setAttendance(studentId, dateStr, !isAttended(studentId, dateStr));
}

/* ============================= DELETE ============================= */

function openDeleteModal(id) { PENDING_DELETE_ID = id; openModal('deleteOverlay'); }

function confirmDelete() {
  if (!PENDING_DELETE_ID) return;
  const id = PENDING_DELETE_ID;
  const btn = document.getElementById('btnConfirmDelete');
  btn.disabled = true;
  callApi('deleteStudent', { id }).then(() => {
    STATE.students = STATE.students.filter(s => s.id !== id);
    STATE.payments = STATE.payments.filter(p => p.studentId !== id);
    STATE.attendance = STATE.attendance.filter(a => a.studentId !== id);
    delete PHOTOS[id];
    rebuildIndex();
    persistLocal();
    closeModal('deleteOverlay');
    render();
    showToast('ลบนักเรียนแล้ว');
  }).catch(onError).finally(() => { btn.disabled = false; });
}

/* ============================= PAYMENT MODAL ============================= */

function openPaymentModal(id) {
  const s = STATE.students.find(x => String(x.id).trim() === String(id).trim());
  if (!s) return;
  ACTIVE_PAYMENT_STUDENT = s;

  document.getElementById('pay_avatar').innerHTML = avatarHtml(s);
  document.getElementById('pay_name').textContent = `${s.fullName} (${s.nickname || '-'})`;
  document.getElementById('pay_meta').textContent = (s.paymentType === 'monthly' ? 'รายเดือน' : 'รายครั้ง') + '  ' + s.id;

  const sessionBlock = document.getElementById('sessionPayBlock');
  const monthlyBlock = document.getElementById('monthlyPayBlock');
  if (s.paymentType === 'monthly') {
    sessionBlock.style.display = 'none';
    monthlyBlock.style.display = 'block';
    MODAL_YEAR = Number(todayStr().slice(0, 4));
    renderMonthGrid(s);
  } else {
    monthlyBlock.style.display = 'none';
    sessionBlock.style.display = 'block';
    renderSessionToggleList(s);
  }
  openModal('paymentOverlay');
}

function renderSessionToggleList(s) {
  const days = Array.from(attendedSet(s.id)).sort().reverse();
  const paidSet = sessionPaidSet(s.id);
  const el = document.getElementById('sessionList');

  const paidCount = days.filter(d => paidSet.has(d)).length;
  const unpaidCount = Math.max(0, days.length - paidCount);
  document.getElementById('sessionPaySummary').innerHTML = `
    <div class="pill">มาเรียน <b>${days.length}</b> วัน</div>
    <div class="pill ok">จ่ายแล้ว <b>${paidCount}</b> วัน</div>
    <div class="pill ${unpaidCount > 0 ? 'due' : ''}">ค้างจ่าย <b>${unpaidCount}</b> วัน</div>`;

  if (days.length === 0) {
    el.innerHTML = '<div class="sess-empty">ยังไม่มีวันที่เช็คชื่อ<br><span style="font-size:12px;color:var(--faint)">เช็คชื่อที่หน้ารายชื่อก่อน แล้วกลับมาติ๊กจ่ายได้ที่นี่</span></div>';
    return;
  }
  const today = todayStr();
  el.innerHTML = days.map(d => {
    const paid = paidSet.has(d);
    return `<div class="sess ${paid ? 'paid' : ''}">
      <div><div class="d">${formatDateTH(d)}</div><div class="s">${d === today ? 'วันนี้' : 'มาเรียนแล้ว'}</div></div>
      <button type="button" class="chip ${paid ? 'ok' : 'due'} btn-toggle-session" data-date="${d}">${paid ? 'ชำระแล้ว' : 'แตะเพื่อบันทึกจ่าย'}</button>
    </div>`;
  }).join('');
  el.querySelectorAll('.btn-toggle-session').forEach(btn => {
    btn.addEventListener('click', e => { e.stopPropagation(); toggleSessionPay(s.id, btn.dataset.date); });
  });
}

function toggleSessionPay(studentId, dateStr) {
  const key = 'spay|' + studentId + '|' + dateStr;
  if (INFLIGHT.has(key)) return;
  const wasPaid = sessionPaidSet(studentId).has(dateStr);
  const want = !wasPaid;

  INFLIGHT.add(key);
  setLocalPayment(studentId, 'session', dateStr, want);
  refreshPaymentModal(studentId);
  refreshStudent(studentId);

  callApi('toggleSessionPayment', { studentId, dateStr, desired: want }).then(res => {
    if (!res || !res.success) throw new Error((res && res.error) || 'ไม่สามารถบันทึกได้');
    showToast(want ? 'บันทึกการชำระเงินแล้ว' : 'ยกเลิกการชำระเงินแล้ว');
  }).catch(err => {
    setLocalPayment(studentId, 'session', dateStr, wasPaid);
    onError(err);
  }).finally(() => {
    INFLIGHT.delete(key);
    refreshPaymentModal(studentId);
    refreshStudent(studentId);
    persistLocal();
  });
}

function renderMonthlySummary(s) {
  const c = monthlyCredits(s);
  const cls = c.remaining > LOW_CREDIT_THRESHOLD ? 'ok' : c.remaining > 0 ? 'low' : 'due';
  document.getElementById('monthlySummary').innerHTML = `
    <div class="pill">จ่ายแล้ว <b>${c.paidMonths}</b> เดือน</div>
    <div class="pill">สิทธิ์ทั้งหมด <b>${c.total}</b></div>
    <div class="pill">ใช้แล้ว <b>${c.used}</b></div>
    <div class="pill ${cls}">คงเหลือ <b>${c.remaining}</b></div>`;
}

function renderMonthGrid(s) {
  renderMonthlySummary(s);
  document.getElementById('yearLabel').textContent = 'พ.ศ. ' + (MODAL_YEAR + 543);
  const paidSet = monthlyPaidSet(s.id);
  const nowMonth = currentMonthStr();

  const grid = document.getElementById('monthGrid');
  grid.innerHTML = MONTH_TH.map((label, i) => {
    const ms = `${MODAL_YEAR}-${String(i + 1).padStart(2, '0')}`;
    const paid = paidSet.has(ms);
    return `<button type="button" class="month ${paid ? 'paid' : ''} ${ms === nowMonth ? 'now' : ''}" data-month="${ms}">
      <div class="ml">${label}</div><div class="ms">${paid ? `จ่ายแล้ว +${SESSIONS_PER_MONTH}` : 'ยังไม่จ่าย'}</div></button>`;
  }).join('');
  grid.querySelectorAll('.month').forEach(cell => {
    cell.addEventListener('click', () => toggleMonth(s.id, cell.dataset.month));
  });
}

function toggleMonth(studentId, monthStr) {
  const key = 'mpay|' + studentId + '|' + monthStr;
  if (INFLIGHT.has(key)) return;
  const wasPaid = monthlyPaidSet(studentId).has(monthStr);
  const want = !wasPaid;

  INFLIGHT.add(key);
  setLocalPayment(studentId, 'monthly', monthStr, want);
  refreshPaymentModal(studentId);
  refreshStudent(studentId);

  callApi('toggleMonthlyPayment', { studentId, monthStr, desired: want }).then(res => {
    if (!res || res.success === false) throw new Error((res && res.error) || 'ไม่สามารถบันทึกได้');
    showToast(want ? `บันทึกแล้ว เพิ่ม ${SESSIONS_PER_MONTH} สิทธิ์` : 'ยกเลิกการชำระเงินแล้ว');
  }).catch(err => {
    setLocalPayment(studentId, 'monthly', monthStr, wasPaid);
    onError(err);
  }).finally(() => {
    INFLIGHT.delete(key);
    refreshPaymentModal(studentId);
    refreshStudent(studentId);
    persistLocal();
  });
}
</script>
