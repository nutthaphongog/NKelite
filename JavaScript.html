<script>
const MONTH_TH = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
const DAY_TH = ['จ', 'อ', 'พ', 'พฤ', 'ศ', 'ส', 'อา']; // เริ่มจันทร์
const SESSIONS_PER_MONTH = 8;       // จ่าย 1 เดือน = 8 สิทธิ์
const LOW_CREDIT_THRESHOLD = 2;     // เหลือน้อยกว่าหรือเท่ากับนี้ = เตือนสีเหลือง
const MAX_PHOTO_LEN = 45000;        // Code.gs รับได้ไม่เกิน 48,000 ตัวอักษร

let STATE = { students: [], payments: [], attendance: [], search: '', filter: 'all', weekOffset: 0 };
let ACTIVE_PAYMENT_STUDENT = null;
let PENDING_DELETE_ID = null;
let PENDING_ATTENDANCE = null;
let MODAL_YEAR = new Date().getFullYear();
let FORM_PHOTO = { value: '', changed: false };

/* ============================= API BRIDGE ============================= */

async function callApi(action, payload = {}) {
  // เปิดผ่าน Cloudflare (ไม่มี google.script.run) -> เรียก /api/gas
  if (!window.google || !window.google.script || !window.google.script.run) {
    const res = await fetch('/api/gas', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action, ...payload })
    });
    const data = await res.json();
    if (data && data.success === false && data.error) throw new Error(data.error);
    return data;
  }
  // เปิดใน Apps Script Web App โดยตรง
  return new Promise((resolve, reject) => {
    const runner = google.script.run
      .withSuccessHandler((res) => {
        if (res && res.success === false && res.error) reject(new Error(res.error));
        else resolve(res);
      })
      .withFailureHandler(reject);
    if (action === 'getAllData') runner.getAllData();
    else if (action === 'addStudent') runner.addStudent(payload.data || payload);
    else if (action === 'updateStudent') runner.updateStudent(payload.data || payload);
    else if (action === 'deleteStudent') runner.deleteStudent(payload.id);
    else if (action === 'toggleAttendance') runner.toggleAttendance(payload.studentId, payload.dateStr || payload.date);
    else if (action === 'toggleSessionPayment') runner.toggleSessionPayment(payload.studentId, payload.dateStr || payload.date);
    else if (action === 'toggleMonthlyPayment') runner.toggleMonthlyPayment(payload.studentId, payload.monthStr || payload.month);
    else reject(new Error('Unknown action: ' + action));
  });
}

/* ============================= BOOTSTRAP ============================= */

document.addEventListener('DOMContentLoaded', () => {
  bindGlobalEvents();
  loadData();
});

function loadData() {
  callApi('getAllData').then(onDataLoaded).catch(onLoadError);
}

function onDataLoaded(data) {
  if (typeof data === 'string') {
    try { data = JSON.parse(data); } catch (e) { console.error('JSON parse error:', e); }
  }
  if (!data || !data.students) {
    onLoadError({ message: 'เซิร์ฟเวอร์ตอบกลับมาว่างเปล่า โปรดตรวจสอบ Code.gs' });
    return;
  }
  STATE.students = data.students || [];
  STATE.payments = data.payments || [];
  STATE.attendance = data.attendance || [];
  const veil = document.getElementById('loadingVeil');
  if (veil) {
    veil.style.opacity = '0';
    setTimeout(() => (veil.style.display = 'none'), 200);
  }
  render();
}

function onLoadError(err) {
  console.error(err);
  const veil = document.getElementById('loadingVeil');
  if (!veil) return;
  veil.innerHTML = `
    <div style="max-width:340px;text-align:center;padding:0 20px;">
      <div style="font-size:15px;font-weight:600;margin-bottom:8px;">โหลดข้อมูลไม่สำเร็จ</div>
      <div style="font-size:12.5px;color:#6B7280;margin-bottom:16px;line-height:1.6;">
        ${escapeHtml((err && err.message) ? err.message : 'ไม่ทราบสาเหตุ')}<br><br>
        ตรวจสอบการเชื่อมต่อ Google Sheets หรือ Deploy สคริปต์ใหม่อีกครั้ง
      </div>
      <button onclick="location.reload()" style="padding:9px 18px;border-radius:10px;border:none;background:#0B1E3D;color:#fff;font-weight:500;font-size:13px;">ลองใหม่</button>
    </div>`;
  veil.style.opacity = '1';
  veil.style.display = 'flex';
}

function onError(err) {
  console.error(err);
  showToast('เกิดข้อผิดพลาด: ' + ((err && err.message) || err));
}

/* ============================= HELPERS ============================= */

function todayStr() { return toDateStr(new Date()); }
function toDateStr(d) {
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function currentMonthStr() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
}
function formatDateTH(dateStr) {
  if (!dateStr) return '-';
  const parts = String(dateStr).split('-');
  if (parts.length !== 3) return dateStr;
  return `${parseInt(parts[2], 10)} ${MONTH_TH[parseInt(parts[1], 10) - 1]} ${parts[0]}`;
}
function escapeHtml(str) {
  return String(str == null ? '' : str).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function initialOf(s) {
  const t = (s.nickname || s.fullName || '?').trim();
  return t ? Array.from(t)[0] : '?';
}
function avatarHtml(s) {
  if (s.photo && String(s.photo).indexOf('data:image/') === 0) {
    return `<img src="${escapeHtml(s.photo)}" alt="">`;
  }
  return escapeHtml(initialOf(s));
}

// 7 วันของสัปดาห์ (จันทร์-อาทิตย์) ตาม offset
function getWeekDates(offset = 0) {
  const now = new Date();
  now.setDate(now.getDate() + offset * 7);
  const dow = now.getDay();
  const monday = new Date(now);
  monday.setDate(now.getDate() + (dow === 0 ? -6 : 1 - dow));
  const days = [];
  for (let i = 0; i < 7; i++) {
    const d = new Date(monday);
    d.setDate(monday.getDate() + i);
    days.push(d);
  }
  return days;
}

/* ============================= DATA HELPERS ============================= */

function uniqueBy(list, keyFn) {
  const seen = new Set();
  return list.filter(x => { const k = keyFn(x); if (seen.has(k)) return false; seen.add(k); return true; });
}
function studentPayments(studentId) {
  const sid = String(studentId).trim();
  return uniqueBy(
    STATE.payments.filter(p => String(p.studentId).trim() === sid && p.paid),
    p => String(p.type).trim() + '_' + String(p.period).trim()
  );
}
function studentAttendance(studentId) {
  const sid = String(studentId).trim();
  return uniqueBy(
    STATE.attendance.filter(a => String(a.studentId).trim() === sid && a.attended),
    a => String(a.date).trim()
  );
}
function isAttended(studentId, dateStr) {
  const sid = String(studentId).trim(), target = String(dateStr).trim();
  return STATE.attendance.some(a => String(a.studentId).trim() === sid && String(a.date).trim() === target && a.attended);
}
function totalSessions(student) {
  return (Number(student.sessionCount) || 0) + studentAttendance(student.id).length;
}

// นโยบายรายเดือน: เดือนที่จ่าย x 8 - จำนวนครั้งที่เช็คชื่อ (ไม่มาไม่ถูกหัก ไม่รีเซ็ตข้ามเดือน)
function monthlyCredits(student) {
  const paidMonths = studentPayments(student.id).filter(p => p.type === 'monthly').length;
  const total = paidMonths * SESSIONS_PER_MONTH;
  const used = studentAttendance(student.id).length;
  return { paidMonths, total, used, remaining: total - used };
}

function getPaymentStatus(student) {
  if (student.paymentType === 'monthly') {
    const c = monthlyCredits(student);
    if (c.remaining > LOW_CREDIT_THRESHOLD) {
      return { state: 'ok', paid: true, typeLabel: 'รายเดือน', label: `เหลือ ${c.remaining} ครั้ง`, note: `ใช้แล้ว ${c.used} จาก ${c.total} ครั้ง` };
    }
    if (c.remaining > 0) {
      return { state: 'low', paid: true, typeLabel: 'รายเดือน', label: `เหลือ ${c.remaining} ครั้ง`, note: 'ใกล้หมด ควรต่อเดือนใหม่' };
    }
    if (c.remaining === 0) {
      return { state: 'due', paid: false, typeLabel: 'รายเดือน', label: 'หมดสิทธิ์ ต้องต่อเดือน', note: c.total ? `ใช้ครบ ${c.total} ครั้งแล้ว` : 'ยังไม่เคยชำระ' };
    }
    return { state: 'due', paid: false, typeLabel: 'รายเดือน', label: `เกินสิทธิ์ ${-c.remaining} ครั้ง`, note: 'ต้องชำระเดือนใหม่' };
  }
  // รายครั้ง: นับเฉพาะวันที่มาเรียนในเดือนปัจจุบันที่ยังไม่จ่าย (เหมือนเดิม)
  const pays = studentPayments(student.id);
  const cm = currentMonthStr();
  const attendedThisMonth = studentAttendance(student.id).filter(a => String(a.date).startsWith(cm));
  const unpaid = attendedThisMonth.filter(a => !pays.some(p => p.type === 'session' && p.period === a.date && p.paid)).length;
  if (attendedThisMonth.length === 0) return { state: 'ok', paid: true, typeLabel: 'รายครั้ง', label: 'ไม่มีรอบค้าง', note: '' };
  if (unpaid === 0) return { state: 'ok', paid: true, typeLabel: 'รายครั้ง', label: 'ชำระครบแล้ว', note: `เดือนนี้เรียน ${attendedThisMonth.length} ครั้ง` };
  return { state: 'due', paid: false, typeLabel: 'รายครั้ง', label: `ค้าง ${unpaid} ครั้ง`, note: `เดือนนี้เรียน ${attendedThisMonth.length} ครั้ง` };
}
function isPaidNow(student) { return getPaymentStatus(student).paid; }

function showToast(msg) {
  const t = document.getElementById('toast');
  if (!t) return;
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 2200);
}
function openModal(id) { document.getElementById(id).classList.add('open'); }
function closeModal(id) { document.getElementById(id).classList.remove('open'); }

/* ============================= RENDER ============================= */

function render() {
  updateWeekDisplay();
  renderStats();
  renderRoster();
}

function updateWeekDisplay() {
  const week = getWeekDates(STATE.weekOffset);
  const o = STATE.weekOffset;
  let prefix = o === 0 ? 'สัปดาห์นี้' : o === -1 ? 'สัปดาห์ที่แล้ว' : o === 1 ? 'สัปดาห์หน้า' : o < 0 ? `ย้อนหลัง ${-o} สัปดาห์` : `ล่วงหน้า ${o} สัปดาห์`;
  document.getElementById('weekDisplayLabel').textContent = `${prefix}  ${formatDateTH(toDateStr(week[0]))} - ${formatDateTH(toDateStr(week[6]))}`;
  document.getElementById('btnResetWeek').style.display = o === 0 ? 'none' : 'inline';
}

function renderStats() {
  const today = todayStr();
  document.getElementById('statTotal').textContent = STATE.students.length;
  document.getElementById('statToday').textContent = STATE.attendance.filter(a => a.date === today && a.attended).length;
  document.getElementById('statDue').textContent = STATE.students.filter(s => !isPaidNow(s)).length;
  document.getElementById('statSession').textContent = STATE.students.filter(s => s.paymentType === 'session').length;
  document.getElementById('statMonthly').textContent = STATE.students.filter(s => s.paymentType === 'monthly').length;
}

function filteredStudents() {
  let list = STATE.students.slice();
  const q = STATE.search.trim().toLowerCase();
  if (q) {
    list = list.filter(s =>
      (s.fullName || '').toLowerCase().includes(q) ||
      (s.nickname || '').toLowerCase().includes(q) ||
      (s.id || '').toLowerCase().includes(q));
  }
  if (STATE.filter === 'due') list = list.filter(s => !isPaidNow(s));
  if (STATE.filter === 'paid') list = list.filter(s => isPaidNow(s));
  return list;
}

const CHECK_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4"><path d="M20 6 9 17l-5-5"/></svg>';

function weekHtml(s) {
  const week = getWeekDates(STATE.weekOffset);
  const today = todayStr();
  const cells = week.map((d, i) => {
    const ds = toDateStr(d);
    const on = isAttended(s.id, ds);
    const cls = ['day-btn'];
    if (on) cls.push('on');
    if (ds === today) cls.push('today');
    return `<div class="day"><div class="day-label">${DAY_TH[i]}</div>
      <button type="button" class="${cls.join(' ')}" data-action="day" data-id="${escapeHtml(s.id)}" data-date="${ds}"
        title="${formatDateTH(ds)}">${on ? CHECK_SVG : d.getDate()}</button></div>`;
  }).join('');
  const done = isAttended(s.id, today);
  return `
    <div class="strip">${cells}</div>
    <div class="week-foot">
      <button type="button" class="checkin ${done ? 'done' : ''}" data-action="quickcheckin" data-id="${escapeHtml(s.id)}">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8"><path d="M20 6 9 17l-5-5"/></svg>
        ${done ? 'มาแล้ววันนี้' : 'เช็คชื่อวันนี้'}
      </button>
      <span class="total">เรียนรวม <b>${totalSessions(s)}</b> ครั้ง</span>
    </div>`;
}

function renderRoster() {
  const body = document.getElementById('rosterBody');
  const empty = document.getElementById('emptyState');
  const list = filteredStudents();
  if (list.length === 0) {
    body.innerHTML = '';
    empty.style.display = STATE.students.length === 0 ? 'block' : 'none';
    if (STATE.students.length > 0) body.innerHTML = '<div class="empty"><p style="margin:0">ไม่พบนักเรียนที่ตรงกับเงื่อนไข</p></div>';
    return;
  }
  empty.style.display = 'none';
  body.innerHTML = list.map(s => {
    const st = getPaymentStatus(s);
    const id = escapeHtml(s.id);
    return `
    <div class="card" data-id="${id}">
      <div class="c-id">
        <div class="avatar">${avatarHtml(s)}</div>
        <div style="min-width:0">
          <div class="c-name">${escapeHtml(s.fullName || '-')}</div>
          <div class="c-meta">
            <span class="nick">${escapeHtml(s.nickname || '-')}</span>
            <span>${id}</span>
            ${s.age ? `<span>${escapeHtml(s.age)} ปี</span>` : ''}
          </div>
        </div>
      </div>
      <div class="c-week">${weekHtml(s)}</div>
      <div class="c-pay">
        <button class="chip ${st.state}" data-action="pay" data-id="${id}">${escapeHtml(st.label)}</button>
        <span class="pay-note">${escapeHtml(st.typeLabel)}${st.note ? ' ' + escapeHtml(st.note) : ''}</span>
      </div>
      <div class="c-actions">
        <button class="icon-btn pay-btn" data-action="pay" data-id="${id}" title="การชำระเงิน" aria-label="การชำระเงิน">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg>
        </button>
        <button class="icon-btn" data-action="edit" data-id="${id}" title="แก้ไข" aria-label="แก้ไข">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4Z"/></svg>
        </button>
        <button class="icon-btn danger" data-action="delete" data-id="${id}" title="ลบ" aria-label="ลบ">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0-1 14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2L4 6"/></svg>
        </button>
      </div>
    </div>`;
  }).join('');
}

/* ============================= EVENTS ============================= */

function bindGlobalEvents() {
  const on = (id, ev, fn) => { const el = document.getElementById(id); if (el) el.addEventListener(ev, fn); };

  on('searchInput', 'input', e => { STATE.search = e.target.value; renderRoster(); });

  on('filterSeg', 'click', e => {
    const btn = e.target.closest('button[data-filter]');
    if (!btn) return;
    document.querySelectorAll('#filterSeg button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    STATE.filter = btn.dataset.filter;
    renderRoster();
  });

  on('btnPrevWeek', 'click', () => { STATE.weekOffset--; render(); });
  on('btnNextWeek', 'click', () => { STATE.weekOffset++; render(); });
  on('btnResetWeek', 'click', () => { STATE.weekOffset = 0; render(); });

  on('btnAddStudent', 'click', () => openStudentModal());
  on('btnAddStudentEmpty', 'click', () => openStudentModal());

  document.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', () => closeModal(b.dataset.close)));
  document.querySelectorAll('.overlay').forEach(ov => ov.addEventListener('click', e => { if (e.target === ov) ov.classList.remove('open'); }));

  on('paymentTypeGroup', 'click', e => {
    const opt = e.target.closest('.radio');
    if (!opt) return;
    document.querySelectorAll('#paymentTypeGroup .radio').forEach(o => o.classList.remove('sel'));
    opt.classList.add('sel');
    const r = opt.querySelector('input');
    if (r) r.checked = true;
  });

  on('btnSaveStudent', 'click', saveStudent);
  on('btnConfirmDelete', 'click', confirmDelete);
  on('btnConfirmAttendance', 'click', confirmAttendance);

  // รูปโปรไฟล์
  on('btnPickPhoto', 'click', () => document.getElementById('f_photoFile').click());
  on('f_photoFile', 'change', onPhotoPicked);
  on('btnRemovePhoto', 'click', () => { FORM_PHOTO = { value: '', changed: true }; refreshPhotoPreview(); });

  // ปีในหน้ารายเดือน
  on('btnPrevYear', 'click', () => { MODAL_YEAR--; if (ACTIVE_PAYMENT_STUDENT) renderMonthGrid(ACTIVE_PAYMENT_STUDENT); });
  on('btnNextYear', 'click', () => { MODAL_YEAR++; if (ACTIVE_PAYMENT_STUDENT) renderMonthGrid(ACTIVE_PAYMENT_STUDENT); });

  on('rosterBody', 'click', e => {
    const btn = e.target.closest('[data-action]');
    if (!btn || btn.disabled) return;
    const id = btn.dataset.id, action = btn.dataset.action;
    if (action === 'pay') openPaymentModal(id);
    if (action === 'edit') openStudentModal(id);
    if (action === 'delete') openDeleteModal(id);
    if (action === 'day') openAttendanceConfirm(id, btn.dataset.date);
    if (action === 'quickcheckin') quickCheckIn(id);
  });
}

/* ============================= PHOTO ============================= */

// ย่อรูปเป็นสี่เหลี่ยมจัตุรัส JPEG ให้ขนาดไม่เกินที่ Google Sheet รับได้
function compressImage(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('อ่านไฟล์รูปไม่ได้'));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error('ไฟล์นี้ไม่ใช่รูปภาพที่รองรับ'));
      img.onload = () => {
        const side = Math.min(img.width, img.height);
        const sx = (img.width - side) / 2, sy = (img.height - side) / 2;
        for (const size of [256, 200, 160, 128, 96]) {
          const canvas = document.createElement('canvas');
          canvas.width = canvas.height = size;
          const ctx = canvas.getContext('2d');
          ctx.fillStyle = '#fff';
          ctx.fillRect(0, 0, size, size);
          ctx.drawImage(img, sx, sy, side, side, 0, 0, size, size);
          for (const q of [0.82, 0.7, 0.58, 0.46, 0.35]) {
            const url = canvas.toDataURL('image/jpeg', q);
            if (url.length <= MAX_PHOTO_LEN) { resolve(url); return; }
          }
        }
        reject(new Error('ไม่สามารถย่อรูปให้เล็กพอได้ ลองเลือกรูปอื่น'));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

function onPhotoPicked(e) {
  const file = e.target.files && e.target.files[0];
  e.target.value = '';
  if (!file) return;
  compressImage(file)
    .then(url => { FORM_PHOTO = { value: url, changed: true }; refreshPhotoPreview(); })
    .catch(onError);
}

function refreshPhotoPreview() {
  const box = document.getElementById('f_photoPreview');
  const name = document.getElementById('f_nickname').value || document.getElementById('f_fullName').value || '?';
  if (FORM_PHOTO.value) box.innerHTML = `<img src="${escapeHtml(FORM_PHOTO.value)}" alt="">`;
  else box.textContent = Array.from(name.trim() || '?')[0];
  document.getElementById('btnRemovePhoto').style.display = FORM_PHOTO.value ? 'inline' : 'none';
  document.getElementById('btnPickPhoto').textContent = FORM_PHOTO.value ? 'เปลี่ยนรูป' : 'เลือกรูป';
}

/* ============================= STUDENT FORM ============================= */

function openStudentModal(id) {
  const isEdit = !!id;
  document.getElementById('studentModalTitle').textContent = isEdit ? 'แก้ไขนักเรียน' : 'เพิ่มนักเรียน';
  const s = isEdit ? STATE.students.find(x => x.id === id) : null;

  document.getElementById('f_id').value = isEdit ? s.id : '';
  document.getElementById('f_fullName').value = isEdit ? s.fullName : '';
  document.getElementById('f_nickname').value = isEdit ? s.nickname : '';
  document.getElementById('f_age').value = isEdit ? s.age : '';
  document.getElementById('f_startDate').value = isEdit ? s.startDate : todayStr();
  document.getElementById('f_sessionCount').value = isEdit ? (s.sessionCount || 0) : 0;

  FORM_PHOTO = { value: isEdit ? (s.photo || '') : '', changed: false };
  refreshPhotoPreview();

  const type = isEdit ? (s.paymentType || 'session') : 'session';
  document.querySelectorAll('#paymentTypeGroup .radio').forEach(o => {
    const match = o.dataset.value === type;
    o.classList.toggle('sel', match);
    o.querySelector('input').checked = match;
  });
  openModal('studentOverlay');
}

function saveStudent() {
  const id = document.getElementById('f_id').value;
  const fullName = document.getElementById('f_fullName').value.trim();
  const nickname = document.getElementById('f_nickname').value.trim();
  const age = document.getElementById('f_age').value;
  const startDate = document.getElementById('f_startDate').value;
  const sessionCount = Number(document.getElementById('f_sessionCount').value || 0);
  const checked = document.querySelector('#paymentTypeGroup input:checked');
  const paymentType = checked ? checked.value : 'session';

  if (!fullName) { showToast('กรุณากรอกชื่อ - นามสกุล'); return; }

  const payload = { id, fullName, nickname, age, startDate, sessionCount, paymentType };
  // รูป: ส่งเฉพาะตอนมีการเปลี่ยน ('' = ลบรูป, ไม่ส่ง = คงรูปเดิม)
  if (FORM_PHOTO.changed) payload.photo = FORM_PHOTO.value;

  const btn = document.getElementById('btnSaveStudent');
  btn.textContent = 'กำลังบันทึก...';
  btn.disabled = true;
  const done = () => { btn.textContent = 'บันทึก'; btn.disabled = false; };

  if (id) {
    callApi('updateStudent', payload).then(() => {
      const s = STATE.students.find(x => x.id === id);
      if (s) {
        Object.assign(s, { fullName, nickname, age, startDate, sessionCount, paymentType });
        if (FORM_PHOTO.changed) s.photo = FORM_PHOTO.value;
      }
      done(); closeModal('studentOverlay'); render(); showToast('บันทึกข้อมูลแล้ว');
    }).catch(e => { done(); onError(e); });
  } else {
    callApi('addStudent', payload).then(res => {
      STATE.students.push({ id: res.id, fullName, nickname, age, startDate, sessionCount, paymentType, createdAt: todayStr(), photo: FORM_PHOTO.value || '' });
      done(); closeModal('studentOverlay'); render(); showToast('เพิ่มนักเรียนแล้ว');
    }).catch(e => { done(); onError(e); });
  }
}

/* ============================= ATTENDANCE ============================= */

function quickCheckIn(studentId) {
  const dateStr = todayStr();
  callApi('toggleAttendance', { studentId, dateStr })
    .then(res => applyAttendanceResult(studentId, dateStr, res))
    .catch(onError);
}

function openAttendanceConfirm(studentId, dateStr) {
  const s = STATE.students.find(x => x.id === studentId);
  if (!s) return;
  PENDING_ATTENDANCE = { studentId, dateStr };
  const already = isAttended(studentId, dateStr);

  document.getElementById('attn_title').textContent = already ? 'ยกเลิกการเช็คชื่อ' : 'เช็คชื่อเข้าเรียน';
  document.getElementById('attn_who').textContent = `${s.fullName} (${s.nickname || '-'})`;
  document.getElementById('attn_when').textContent = `วันที่ ${formatDateTH(dateStr)}${dateStr === todayStr() ? ' (วันนี้)' : ''}`;
  document.getElementById('attn_icon').className = 'confirm-ic' + (already ? ' cancel' : '');

  const btn = document.getElementById('btnConfirmAttendance');
  btn.textContent = already ? 'ยกเลิกเช็คชื่อ' : 'ยืนยันว่ามาเรียน';
  btn.className = 'btn ' + (already ? 'btn-danger' : 'btn-primary');
  openModal('attendanceOverlay');
}

function confirmAttendance() {
  if (!PENDING_ATTENDANCE) return;
  const { studentId, dateStr } = PENDING_ATTENDANCE;
  callApi('toggleAttendance', { studentId, dateStr }).then(res => {
    applyAttendanceResult(studentId, dateStr, res);
    closeModal('attendanceOverlay');
  }).catch(onError);
}

function applyAttendanceResult(studentId, dateStr, res) {
  const cleanDate = res && res.date ? String(res.date).trim() : String(dateStr).trim();
  const cleanId = String(studentId).trim();
  STATE.attendance = STATE.attendance.filter(a => !(String(a.studentId).trim() === cleanId && String(a.date).trim() === cleanDate));

  if (res && res.attended) {
    STATE.attendance.push({ studentId: cleanId, date: cleanDate, attended: true });
    showToast('เช็คชื่อแล้ว');
  } else {
    STATE.payments = STATE.payments.filter(p => !(String(p.studentId).trim() === cleanId && p.type === 'session' && String(p.period).trim() === cleanDate));
    showToast('ยกเลิกการเช็คชื่อแล้ว');
  }
  render();

  if (ACTIVE_PAYMENT_STUDENT && String(ACTIVE_PAYMENT_STUDENT.id).trim() === cleanId) {
    if (ACTIVE_PAYMENT_STUDENT.paymentType === 'session') renderSessionToggleList(ACTIVE_PAYMENT_STUDENT);
    else renderMonthlySummary(ACTIVE_PAYMENT_STUDENT);
  }
}

/* ============================= DELETE ============================= */

function openDeleteModal(id) { PENDING_DELETE_ID = id; openModal('deleteOverlay'); }

function confirmDelete() {
  if (!PENDING_DELETE_ID) return;
  const id = PENDING_DELETE_ID;
  callApi('deleteStudent', { id }).then(() => {
    STATE.students = STATE.students.filter(s => s.id !== id);
    STATE.payments = STATE.payments.filter(p => p.studentId !== id);
    STATE.attendance = STATE.attendance.filter(a => a.studentId !== id);
    closeModal('deleteOverlay');
    render();
    showToast('ลบนักเรียนแล้ว');
  }).catch(onError);
}

/* ============================= PAYMENT MODAL ============================= */

function openPaymentModal(id) {
  const s = STATE.students.find(x => String(x.id).trim() === String(id).trim());
  if (!s) return;
  ACTIVE_PAYMENT_STUDENT = s;

  document.getElementById('pay_avatar').innerHTML = avatarHtml(s);
  document.getElementById('pay_name').textContent = `${s.fullName} (${s.nickname || '-'})`;
  document.getElementById('pay_meta').textContent = (s.paymentType === 'monthly' ? 'รายเดือน' : 'รายครั้ง') + '  ' + s.id;

  const sessionBlock = document.getElementById('sessionPayBlock');
  const monthlyBlock = document.getElementById('monthlyPayBlock');
  if (s.paymentType === 'monthly') {
    sessionBlock.style.display = 'none';
    monthlyBlock.style.display = 'block';
    MODAL_YEAR = new Date().getFullYear();
    renderMonthGrid(s);
  } else {
    monthlyBlock.style.display = 'none';
    sessionBlock.style.display = 'block';
    renderSessionToggleList(s);
  }
  openModal('paymentOverlay');
}

function renderSessionToggleList(s) {
  const attendedDays = studentAttendance(s.id).slice().sort((a, b) => b.date.localeCompare(a.date));
  const el = document.getElementById('sessionList');
  const pays = studentPayments(s.id);
  const isPaid = a => pays.some(p => p.type === 'session' && String(p.period).trim() === String(a.date).trim() && p.paid);

  const paidCount = attendedDays.filter(isPaid).length;
  const unpaidCount = Math.max(0, attendedDays.length - paidCount);
  document.getElementById('sessionPaySummary').innerHTML = `
    <div class="pill">มาเรียน <b>${attendedDays.length}</b> วัน</div>
    <div class="pill ok">จ่ายแล้ว <b>${paidCount}</b> วัน</div>
    <div class="pill ${unpaidCount > 0 ? 'due' : ''}">ค้างจ่าย <b>${unpaidCount}</b> วัน</div>`;

  if (attendedDays.length === 0) {
    el.innerHTML = '<div class="sess-empty">ยังไม่มีวันที่เช็คชื่อ<br><span style="font-size:12px;color:var(--faint)">เช็คชื่อที่หน้ารายชื่อก่อน แล้วกลับมาติ๊กจ่ายได้ที่นี่</span></div>';
    return;
  }
  el.innerHTML = attendedDays.map(a => {
    const paid = isPaid(a);
    return `<div class="sess ${paid ? 'paid' : ''}">
      <div><div class="d">${formatDateTH(a.date)}</div><div class="s">${a.date === todayStr() ? 'วันนี้' : 'มาเรียนแล้ว'}</div></div>
      <button type="button" class="chip ${paid ? 'ok' : 'due'} btn-toggle-session" data-date="${a.date}">${paid ? 'ชำระแล้ว' : 'แตะเพื่อบันทึกจ่าย'}</button>
    </div>`;
  }).join('');
  el.querySelectorAll('.btn-toggle-session').forEach(btn => {
    btn.addEventListener('click', e => { e.stopPropagation(); toggleSessionPay(s.id, btn.dataset.date); });
  });
}

function toggleSessionPay(studentId, dateStr) {
  const cleanDate = String(dateStr).trim(), cleanId = String(studentId).trim();
  callApi('toggleSessionPayment', { studentId: cleanId, dateStr: cleanDate }).then(res => {
    if (!res || !res.success) { showToast((res && res.error) ? res.error : 'ไม่สามารถบันทึกได้'); return; }
    const rd = res.date ? String(res.date).trim() : cleanDate;
    STATE.payments = STATE.payments.filter(p => !(String(p.studentId).trim() === cleanId && p.type === 'session' && String(p.period).trim() === rd));
    if (res.paid) STATE.payments.push({ studentId: cleanId, type: 'session', period: rd, paid: true });
    if (ACTIVE_PAYMENT_STUDENT && String(ACTIVE_PAYMENT_STUDENT.id).trim() === cleanId) renderSessionToggleList(ACTIVE_PAYMENT_STUDENT);
    renderStats();
    renderRoster();
    showToast(res.paid ? 'บันทึกการชำระเงินแล้ว' : 'ยกเลิกการชำระเงินแล้ว');
  }).catch(onError);
}

function renderMonthlySummary(s) {
  const c = monthlyCredits(s);
  const cls = c.remaining > LOW_CREDIT_THRESHOLD ? 'ok' : c.remaining > 0 ? 'low' : 'due';
  document.getElementById('monthlySummary').innerHTML = `
    <div class="pill">จ่ายแล้ว <b>${c.paidMonths}</b> เดือน</div>
    <div class="pill">สิทธิ์ทั้งหมด <b>${c.total}</b></div>
    <div class="pill">ใช้แล้ว <b>${c.used}</b></div>
    <div class="pill ${cls}">คงเหลือ <b>${c.remaining}</b></div>`;
}

function renderMonthGrid(s) {
  renderMonthlySummary(s);
  document.getElementById('yearLabel').textContent = 'พ.ศ. ' + (MODAL_YEAR + 543);
  const paidSet = new Set(studentPayments(s.id).filter(p => p.type === 'monthly').map(p => p.period));
  const nowMonth = currentMonthStr();

  const grid = document.getElementById('monthGrid');
  grid.innerHTML = MONTH_TH.map((label, i) => {
    const ms = `${MODAL_YEAR}-${String(i + 1).padStart(2, '0')}`;
    const paid = paidSet.has(ms);
    return `<button type="button" class="month ${paid ? 'paid' : ''} ${ms === nowMonth ? 'now' : ''}" data-month="${ms}">
      <div class="ml">${label}</div><div class="ms">${paid ? `จ่ายแล้ว +${SESSIONS_PER_MONTH}` : 'ยังไม่จ่าย'}</div></button>`;
  }).join('');
  grid.querySelectorAll('.month').forEach(cell => {
    cell.addEventListener('click', () => toggleMonth(s.id, cell.dataset.month));
  });
}

function toggleMonth(studentId, monthStr) {
  callApi('toggleMonthlyPayment', { studentId, monthStr }).then(res => {
    STATE.payments = STATE.payments.filter(p => !(p.studentId === studentId && p.type === 'monthly' && p.period === monthStr));
    if (res.paid) STATE.payments.push({ studentId, type: 'monthly', period: monthStr, paid: true });
    renderMonthGrid(ACTIVE_PAYMENT_STUDENT);
    renderStats();
    renderRoster();
    showToast(res.paid ? `บันทึกแล้ว เพิ่ม ${SESSIONS_PER_MONTH} สิทธิ์` : 'ยกเลิกการชำระเงินแล้ว');
  }).catch(onError);
}
</script>
