<style>
@import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap');

:root {
  --bg: #F6F7F9;
  --card: #FFFFFF;
  --ink: #14181F;
  --muted: #6B7280;
  --faint: #9CA3AF;
  --line: #E6E8EC;
  --navy: #0B1E3D;
  --red: #D62839;
  --red-tint: #FDEEEF;
  --green: #12A150;
  --green-tint: #E8F6EE;
  --amber: #B7791F;
  --amber-tint: #FDF3E1;
  --radius: 14px;
  --shadow: 0 1px 2px rgba(20, 24, 31, .04), 0 4px 16px rgba(20, 24, 31, .04);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--ink);
  font-family: 'Kanit', -apple-system, 'Segoe UI', sans-serif; font-size: 14px; -webkit-font-smoothing: antialiased; }
button { font-family: inherit; cursor: pointer; touch-action: manipulation; }
input, select { font-family: inherit; }
:focus-visible { outline: 2px solid var(--navy); outline-offset: 2px; }

/* ---------- Header ---------- */
.topbar { position: sticky; top: 0; z-index: 40; background: rgba(246, 247, 249, .92); backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line); padding-top: env(safe-area-inset-top); }
.topbar-in { max-width: 1080px; margin: 0 auto; padding: 12px 20px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { display: flex; align-items: center; gap: 10px; }
.brand-mark { width: 34px; height: 34px; border-radius: 10px; background: var(--navy); color: #fff;
  display: grid; place-items: center; font-weight: 600; font-size: 16px; }
.brand-name { font-weight: 600; font-size: 16px; line-height: 1.1; }
.brand-sub { font-size: 11.5px; color: var(--muted); font-weight: 300; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; padding: 9px 16px; border-radius: 10px;
  border: 1px solid transparent; font-size: 13.5px; font-weight: 500; transition: background .15s, border-color .15s, transform .1s; }
.btn:active { transform: scale(.97); }
.btn:disabled { opacity: .55; cursor: default; }
.btn-primary { background: var(--navy); color: #fff; }
.btn-primary:hover { background: #14305f; }
.btn-ghost { background: var(--card); color: var(--ink); border-color: var(--line); }
.btn-ghost:hover { border-color: var(--faint); }
.btn-danger { background: var(--red); color: #fff; }

/* ---------- Page ---------- */
.main { max-width: 1080px; margin: 0 auto; padding: 22px 20px 80px; }
.page-title { font-size: 24px; font-weight: 600; margin: 0 0 2px; }
.page-sub { margin: 0 0 18px; color: var(--muted); font-size: 13.5px; font-weight: 300; }

.stats { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-bottom: 16px; }
.stat { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; }
.stat-num { font-size: 26px; font-weight: 600; line-height: 1.1; }
.stat-num.ok { color: var(--green); }
.stat-num.warn { color: var(--red); }
.stat-label { font-size: 12px; color: var(--muted); margin-top: 2px; font-weight: 300; }

.toolbar { display: flex; gap: 10px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
.search { position: relative; flex: 1; min-width: 220px; }
.search input { width: 100%; padding: 10px 14px 10px 38px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); font-size: 13.5px; outline: none; }
.search input:focus { border-color: var(--navy); }
.search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--faint); }
.seg { display: flex; background: #ECEEF2; border-radius: 10px; padding: 3px; }
.seg button { border: 0; background: transparent; padding: 7px 14px; border-radius: 8px; font-size: 13px; color: var(--muted); }
.seg button.active { background: var(--card); color: var(--ink); font-weight: 500; box-shadow: 0 1px 2px rgba(0, 0, 0, .06); }

.weekbar { display: flex; align-items: center; justify-content: space-between; gap: 8px; background: var(--card);
  border: 1px solid var(--line); border-radius: var(--radius); padding: 8px 10px; margin-bottom: 14px; }
.weekbar .mid { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 2px; }
.week-label { font-weight: 500; font-size: 14px; }
.week-reset { border: 0; background: none; color: #1D4ED8; font-size: 12px; padding: 0; }
.icon-nav { width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); display: grid; place-items: center; color: var(--ink); }
.icon-nav:hover { border-color: var(--faint); }

/* ---------- Student rows ---------- */
.list { display: flex; flex-direction: column; gap: 10px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow);
  padding: 14px 16px; display: grid; gap: 12px 18px; align-items: center;
  grid-template-columns: minmax(230px, 1.2fr) auto minmax(170px, 1fr) auto; }
.c-id { display: flex; align-items: center; gap: 12px; min-width: 0; }
.avatar { width: 48px; height: 48px; border-radius: 50%; background: #E9EDF4; color: var(--navy); flex-shrink: 0;
  display: grid; place-items: center; font-weight: 600; font-size: 16px; overflow: hidden; }
.avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
.c-name { font-weight: 600; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.c-meta { display: flex; flex-wrap: wrap; gap: 4px 8px; font-size: 12px; color: var(--muted); margin-top: 2px; font-weight: 300; }
.c-meta .nick { color: var(--navy); font-weight: 500; }

.c-week { display: flex; flex-direction: column; gap: 8px; }
.strip { display: flex; gap: 6px; }
.day { display: flex; flex-direction: column; align-items: center; gap: 3px; }
.day-label { font-size: 10.5px; color: var(--faint); }
.day-btn { width: 32px; height: 32px; border-radius: 50%; border: 1.5px solid var(--line); background: var(--card); color: var(--muted);
  font-size: 11.5px; font-weight: 500; padding: 0; display: grid; place-items: center; transition: border-color .15s, background .15s; }
.day-btn:hover { border-color: var(--navy); }
.day-btn.today { border-color: var(--navy); color: var(--navy); font-weight: 600; }
.day-btn.on { background: var(--green); border-color: var(--green); color: #fff; }
.day-btn svg { width: 14px; height: 14px; }
.week-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.total { font-size: 12px; color: var(--muted); font-weight: 300; }
.total b { color: var(--ink); font-weight: 600; font-size: 14px; }
.checkin { display: inline-flex; align-items: center; gap: 5px; padding: 5px 11px; border-radius: 8px; border: 1.5px solid var(--green);
  background: var(--card); color: var(--green); font-size: 12.5px; font-weight: 500; }
.checkin.done { background: var(--green); color: #fff; }

.c-pay { display: flex; flex-direction: column; gap: 5px; align-items: flex-start; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 99px; border: 0; font-size: 12.5px; font-weight: 500; }
.chip::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.chip.ok { background: var(--green-tint); color: var(--green); }
.chip.low { background: var(--amber-tint); color: var(--amber); }
.chip.due { background: var(--red-tint); color: var(--red); }
.pay-note { font-size: 11.5px; color: var(--muted); font-weight: 300; }

.c-actions { display: flex; gap: 6px; justify-content: flex-end; }
.icon-btn { width: 34px; height: 34px; border-radius: 9px; border: 1px solid var(--line); background: var(--card); color: var(--muted); display: grid; place-items: center; }
.icon-btn:hover { color: var(--navy); border-color: var(--faint); }
.icon-btn.danger:hover { color: var(--red); border-color: #F3B8BE; background: var(--red-tint); }
.pay-btn { display: none; }

.empty { text-align: center; padding: 56px 20px; color: var(--muted); background: var(--card); border: 1px dashed var(--line); border-radius: var(--radius); }
.empty h3 { margin: 0 0 6px; color: var(--ink); font-size: 18px; }
.empty p { margin: 0 0 16px; }

/* ---------- Modals ---------- */
.overlay { position: fixed; inset: 0; background: rgba(15, 23, 42, .45); display: none; align-items: center; justify-content: center; padding: 20px; z-index: 90; overflow-y: auto; }
.overlay.open { display: flex; }
.modal { background: var(--card); width: 100%; max-width: 460px; border-radius: 18px; box-shadow: 0 20px 50px rgba(15, 23, 42, .25);
  display: flex; flex-direction: column; max-height: 90vh; animation: pop .16s ease-out; }
.modal.wide { max-width: 560px; }
@keyframes pop { from { opacity: 0; transform: translateY(10px) scale(.98); } to { opacity: 1; transform: none; } }
.m-head { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; border-bottom: 1px solid var(--line); }
.m-head h2 { margin: 0; font-size: 17px; font-weight: 600; }
.m-close { border: 0; background: none; width: 32px; height: 32px; border-radius: 8px; color: var(--muted); display: grid; place-items: center; }
.m-close:hover { background: var(--bg); }
.m-body { padding: 18px 20px; overflow-y: auto; flex: 1; }
.m-foot { padding: 12px 20px; border-top: 1px solid var(--line); display: flex; justify-content: flex-end; gap: 8px; }

.form { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field.full { grid-column: 1 / -1; }
.field label { font-size: 12.5px; color: var(--muted); font-weight: 500; }
.field input[type=text], .field input[type=number], .field input[type=date] { padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; font-size: 14px; outline: none; background: var(--card); color: var(--ink); }
.field input:focus { border-color: var(--navy); }
.hint { font-size: 11.5px; color: var(--faint); font-weight: 300; }

.photo-row { display: flex; align-items: center; gap: 14px; }
.photo-row .avatar { width: 64px; height: 64px; font-size: 20px; }
.photo-actions { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
.photo-actions .btn { padding: 6px 12px; font-size: 12.5px; }
.link-danger { border: 0; background: none; color: var(--red); font-size: 12px; padding: 0; }

.radios { display: flex; gap: 8px; }
.radio { flex: 1; border: 1.5px solid var(--line); border-radius: 10px; padding: 10px 12px; display: flex; align-items: center; gap: 8px; font-size: 13.5px; font-weight: 500; color: var(--muted); cursor: pointer; }
.radio.sel { border-color: var(--navy); color: var(--navy); background: #F1F4FA; }
.radio input { accent-color: var(--navy); }

.who { display: flex; align-items: center; gap: 12px; background: var(--bg); border-radius: 12px; padding: 12px 14px; margin-bottom: 14px; }
.who .avatar { width: 42px; height: 42px; font-size: 14px; }
.who-name { font-weight: 600; }
.who-meta { font-size: 12px; color: var(--muted); font-weight: 300; }

.pills { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
.pill { background: var(--bg); border-radius: 10px; padding: 7px 12px; font-size: 12px; color: var(--muted); }
.pill b { font-size: 16px; color: var(--ink); font-weight: 600; margin: 0 2px; }
.pill.ok b { color: var(--green); }
.pill.low b { color: var(--amber); }
.pill.due b { color: var(--red); }
.note { font-size: 12.5px; color: var(--muted); margin: 0 0 12px; line-height: 1.55; font-weight: 300; }

.year-nav { display: flex; align-items: center; justify-content: center; gap: 14px; margin-bottom: 10px; }
.year-nav b { font-size: 15px; min-width: 70px; text-align: center; }
.month-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.month { border: 1.5px solid var(--line); border-radius: 12px; padding: 11px 6px; text-align: center; background: var(--card); }
.month .ml { font-weight: 500; font-size: 13px; }
.month .ms { font-size: 11.5px; color: var(--faint); margin-top: 2px; }
.month.paid { background: var(--green-tint); border-color: #BFE6CF; }
.month.paid .ml, .month.paid .ms { color: var(--green); }
.month.now { box-shadow: inset 0 0 0 1.5px var(--navy); }

.sess-list { display: flex; flex-direction: column; gap: 8px; max-height: 280px; overflow-y: auto; }
.sess { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 12px; border: 1.5px solid var(--line); border-radius: 12px; }
.sess.paid { background: var(--green-tint); border-color: #BFE6CF; }
.sess .d { font-weight: 500; }
.sess .s { font-size: 11.5px; color: var(--muted); font-weight: 300; }
.sess-empty { text-align: center; padding: 28px 14px; color: var(--muted); background: var(--bg); border-radius: 12px; line-height: 1.6; }

.confirm { text-align: center; padding: 6px 0; }
.confirm-ic { width: 56px; height: 56px; border-radius: 50%; margin: 0 auto 12px; display: grid; place-items: center; background: var(--green-tint); color: var(--green); }
.confirm-ic.cancel { background: var(--red-tint); color: var(--red); }
.confirm .nm { font-weight: 600; font-size: 16px; }
.confirm .dt { color: var(--muted); margin-top: 3px; }

.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); transform: translate(-50%, 10px); background: var(--navy); color: #fff;
  padding: 10px 20px; border-radius: 10px; font-size: 13.5px; opacity: 0; pointer-events: none; transition: opacity .18s, transform .18s; z-index: 120; max-width: 90vw; text-align: center; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.veil { position: fixed; inset: 0; background: var(--bg); display: flex; flex-direction: column; gap: 12px; align-items: center; justify-content: center; z-index: 130; transition: opacity .2s; }
.spinner { width: 32px; height: 32px; border-radius: 50%; border: 3px solid var(--line); border-top-color: var(--navy); animation: spin .7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { * { animation-duration: .01ms !important; transition-duration: .01ms !important; } }

/* ---------- Mobile ---------- */
@media (max-width: 900px) {
  .stats { grid-template-columns: repeat(3, 1fr); }
  .stat:nth-child(4) { grid-column: span 1; }
  .stat:nth-child(5) { grid-column: span 2; }
  .card { grid-template-columns: 1fr auto; grid-template-areas: "id pay" "week week" "act act"; padding: 14px; }
  .c-id { grid-area: id; }
  .c-pay { grid-area: pay; align-items: flex-end; text-align: right; }
  .c-week { grid-area: week; background: var(--bg); border-radius: 12px; padding: 10px; }
  .strip { display: grid; grid-template-columns: repeat(7, 1fr); width: 100%; justify-items: center; }
  .day-btn { width: 38px; height: 38px; font-size: 12.5px; }
  .c-actions { grid-area: act; justify-content: flex-end; }
  .icon-btn { width: 38px; height: 38px; }
  .pay-btn { display: grid; color: var(--navy); background: #F1F4FA; }
  .checkin { padding: 8px 14px; font-size: 13.5px; }
}
@media (max-width: 560px) {
  .main { padding: 16px 14px 80px; }
  .topbar-in { padding: 10px 14px; }
  .brand-sub { display: none; }
  .page-title { font-size: 21px; }
  .toolbar { flex-direction: column; align-items: stretch; }
  .seg { width: 100%; }
  .seg button { flex: 1; padding: 8px 4px; }
  .weekbar .icon-nav { width: 34px; height: 34px; }
  .overlay { padding: 0; align-items: flex-end; }
  .modal, .modal.wide { max-width: 100%; border-radius: 20px 20px 0 0; max-height: 92vh; animation: slideUp .2s ease-out; }
  .m-foot { padding-bottom: calc(14px + env(safe-area-inset-bottom)); }
  .form { grid-template-columns: 1fr; }
  .field input { font-size: 16px; }
}
@keyframes slideUp { from { transform: translateY(100%); } to { transform: none; } }
</style>
